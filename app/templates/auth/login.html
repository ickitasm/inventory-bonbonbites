{% extends 'base.html' %}

{% block title %}Masuk Sistem - Bonbonbites{% endblock %}

{% block content %}
<div class="bg-warm-card dark:bg-mono-card border border-warm-border dark:border-mono-border rounded-3xl p-7 sm:p-9 shadow-sm transition-colors">
    <!-- Logo & Identitas -->
    <div class="text-center mb-7">
        <div class="w-12 h-12 rounded-2xl bg-stone-800 dark:bg-neutral-200 text-stone-50 dark:text-neutral-900 flex items-center justify-center mx-auto mb-4 shadow-xs">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-warm-ink dark:text-white tracking-tight">Bonbonbites</h1>
        <p class="text-xs sm:text-sm text-warm-muted dark:text-mono-muted mt-1">Sistem Manajemen Inventori &amp; Stock Opname</p>
    </div>

    <!-- Form Login -->
    <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
        <div>
            <label for="username" class="block text-xs font-bold text-stone-600 dark:text-neutral-400 uppercase tracking-wider mb-1.5">Username</label>
            <input type="text" id="username" name="username" required autofocus
                   placeholder="Masukkan username"
                   class="w-full px-3.5 py-2.5 rounded-xl border border-warm-border dark:border-mono-border bg-warm-bg/60 dark:bg-mono-bg text-warm-ink dark:text-mono-ink text-sm focus:outline-none focus:ring-2 focus:ring-stone-400 dark:focus:ring-neutral-600 transition">
        </div>

        <div>
            <label for="password" class="block text-xs font-bold text-stone-600 dark:text-neutral-400 uppercase tracking-wider mb-1.5">Password</label>
            <div class="relative">
                <input type="password" id="password" name="password" required
                       placeholder="Masukkan password"
                       class="w-full px-3.5 py-2.5 pr-10 rounded-xl border border-warm-border dark:border-mono-border bg-warm-bg/60 dark:bg-mono-bg text-warm-ink dark:text-mono-ink text-sm focus:outline-none focus:ring-2 focus:ring-stone-400 dark:focus:ring-neutral-600 transition">
                <button type="button" onclick="togglePassword()" aria-label="Lihat Password"
                        class="absolute inset-y-0 right-0 px-3 flex items-center text-warm-muted dark:text-mono-muted hover:text-warm-ink dark:hover:text-white">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="pt-2">
            <button type="submit"
                    class="w-full py-2.5 px-4 bg-stone-800 hover:bg-stone-900 text-stone-50 dark:bg-neutral-200 dark:hover:bg-white dark:text-neutral-900 font-bold text-sm rounded-xl shadow-xs transition cursor-pointer">
                Masuk ke Sistem
            </button>
        </div>
    </form>
</div>

<script>
    function togglePassword() {
        const pwd = document.getElementById('password');
        pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }
</script>
{% endblock %}
